<aside class="sidebar">
  <div class="brand brand-link">
    <div class="dot"></div>
    <a class="sidebar-title" href="/writing-assistant"
      ><h1>Asistirano pisanje</h1></a
    >
  </div>

  <div class="quick-links">
    <a href="/document-type-management" class="quick-link"
      >Upravljaj tipovima dokumenata ↗</a
    >
    <a class="quick-link" (click)="openSystemAnalytics.emit()"
      >Analitika celog sistema ↗</a
    >
    <a class="quick-link" href="/register">Upravljaj korisnčkim nalozima ↗</a>
  </div>

  <button class="wa-btn primary padded-btn" (click)="onCreateNewPrompt()">
    + Kreiraj novi prompt
  </button>

  <div class="section-head">
    <div class="section-title">Promptovi</div>
    <button
      class="search-toggle"
      (click)="toggleSearch()"
      [attr.aria-expanded]="showSearch"
      aria-controls="promptSearch"
    >
      🔎 Pretraži
    </button>
  </div>

  <div class="search-wrap" *ngIf="showSearch">
    <input
      #searchInputRef
      id="promptSearch"
      class="wa-input small search-input"
      type="text"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchInput($event)"
      placeholder="Pretraži promptove…"
      autocomplete="off"
    />
    <button
      class="wa-btn small ghost"
      type="button"
      (click)="clearSearch()"
      aria-label="Obriši i zatvori pretragu"
      title="Obriši"
    >
      ✕
    </button>
  </div>

  <div #scrollAreaRef class="scroll-area" (scroll)="onScroll($event)">
    <div *ngIf="loading" class="initial-loading">Učitavanje...</div>

    <div class="list" *ngIf="!loading">
      <div
        class="item"
        *ngFor="let p of prompts"
        [class.selected]="p.id === selectedId"
      >
        <div class="avatar" (click)="onSelectPrompt(p)">📄</div>

        <div class="meta" (click)="onSelectPrompt(p)">
          <div class="title">
            {{ p.title || "(bez naslova)" }}
            <span *ngIf="p.isActive" class="badge">aktivan</span>
          </div>
          <div class="sub">
            {{ p.updatedAt ? (p.updatedAt | date : "short") : "" }}
          </div>
        </div>

        <div class="menu-wrap" (click)="$event.stopPropagation()">
          <button class="menu-btn" (click)="toggleMenu(p.id)">⋮</button>
          <div class="menu" *ngIf="menuOpenId === p.id">
            <button class="menu-item" (click)="onDelete(p.id)">Obriši</button>
          </div>
        </div>
      </div>

      <div class="lazy-hint" *ngIf="bottomHintVisible && !loadingMore">
        <div class="shimmer-line"></div>
      </div>

      <div class="infinite-loader" *ngIf="loadingMore">
        <span class="spinner" aria-hidden="true"></span>
        <span>Učitavanje još…</span>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <button class="wa-btn full" type="button" (click)="onLogout()">
      ⎋ Odjavi se
    </button>
  </div>
</aside>
