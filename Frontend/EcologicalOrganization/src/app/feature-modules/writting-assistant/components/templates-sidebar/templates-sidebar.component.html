<aside class="sidebar2">
  <div class="templates-head">
    <strong>Šabloni</strong>
    <button
      class="wa-btn ghost smallbtn"
      type="button"
      (click)="onHide()"
      title="Sakrij"
    >
      ❌
    </button>
  </div>

  <div class="actions">
    <button class="wa-btn full" type="button" (click)="openCreateModal()">
      + Dodaj novi šablon
    </button>
  </div>

  <div class="tpl-search">
    <input
      #tplSearchInputRef
      class="wa-input"
      type="text"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchInput($event)"
      placeholder="Pretraži po nazivu ili tipu dokumenta"
      autocomplete="off"
    />
    <button
      class="wa-btn small ghost"
      type="button"
      (click)="clearSearch()"
      title="Obriši"
    >
      ✕
    </button>
  </div>

  <div *ngIf="loading && !loadingMore" class="loading">Učitavanje…</div>

  <div
    #tplScrollRef
    class="template-list"
    (scroll)="onScroll($event)"
    [class.disabled]="loading && !loadingMore"
  >
    <div
      class="t-item"
      *ngFor="let t of templates"
      [class.disabled]="creating && t.id === deletingId"
      (click)="onSelectTemplate(t)"
    >
      <div class="t-meta">
        <div class="t-name">{{ t.name }}</div>
        <div class="t-desc">
          {{ t.documentTypeName || "Dokument tip #" + t.documentTypeId }}
        </div>
      </div>

      <div class="menu-wrap" (click)="$event.stopPropagation()">
        <button class="menu-btn" (click)="toggleMenu(t.id)">⋮</button>
        <div class="menu" *ngIf="menuOpenId === t.id">
          <button class="menu-item danger" (click)="onDeleteTemplate(t)">
            Obriši
          </button>
        </div>
      </div>
    </div>

    <div class="lazy-hint" *ngIf="bottomHintVisible && !loadingMore">
      <div class="shimmer-line"></div>
    </div>

    <div class="infinite-loader" *ngIf="loadingMore">
      <span class="spinner" aria-hidden="true"></span>
      <span>Učitavanje još…</span>
    </div>
  </div>
</aside>

<xp-add-new-template
  *ngIf="showCreateModal"
  [documentTypes]="documentTypes"
  (close)="onModalClose()"
  (created)="onTemplateCreated($event)"
></xp-add-new-template>
